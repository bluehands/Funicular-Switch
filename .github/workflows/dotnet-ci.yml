name: .NET CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        # runtimes for the older test target frameworks (net8/net9/net10); net11 comes with the SDK from global.json
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore ./Source
    - name: Build
      run: dotnet build ./Source --no-restore /p:TestConfiguration="IgnoreNetFramework"
    - name: Test
      run: dotnet test ./Source --no-build --verbosity normal  /p:TestConfiguration="IgnoreNetFramework"
